name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  vet:
    name: Vet and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  smoke:
    name: Smoke test CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o gitrespect ./cmd/gitrespect

      - name: version and help
        run: |
          ./gitrespect version
          ./gitrespect --help

      - name: Analyze this repository
        run: ./gitrespect -a "$(git log -1 --format=%ae)" -s "5 years ago" --metrics=all

      - name: JSON output is valid
        run: |
          ./gitrespect -a "$(git log -1 --format=%ae)" -s "5 years ago" -o json -f out.json
          python3 -c "import json,sys; json.load(open('out.json'))"

      - name: HTML output is produced
        run: |
          ./gitrespect -a "$(git log -1 --format=%ae)" -s "5 years ago" -o html -f out.html
          test -s out.html
